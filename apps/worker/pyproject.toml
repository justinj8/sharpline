[project]
name = "sharpline-worker"
version = "0.1.0"
description = "Sharpline scheduler and job worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sharpline",
    "procrastinate>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sharpline_worker"]

[tool.uv.sources]
sharpline = { workspace = true }
