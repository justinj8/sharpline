[project]
name = "sharpline-api"
version = "0.1.0"
description = "Sharpline FastAPI service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sharpline",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sharpline_api"]

[tool.uv.sources]
sharpline = { workspace = true }
