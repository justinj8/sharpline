[alembic]
script_location = %(here)s/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is intentionally unset: env.py reads DATABASE_URL via Settings,
# and tests inject their throwaway database URL with set_main_option.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
